name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't paste your .p8 key, Issuer ID, Vendor Number or .env. Security issues: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run OpenConnect?
      options: [Docker Compose, Docker Compose + Tailscale, npm run dev, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker logs openconnect`
      render: text
