# Publishing a release: bump "version" in package.json, add a section to CHANGELOG.md, then
#   git tag v1.2.3 && git push origin v1.2.3
# This builds the Docker images for Intel and ARM (Apple Silicon, Raspberry Pi), pushes them to
# ghcr.io/oddomens/openconnect and openconnect-studio, and creates the GitHub Release from the
# changelog.
#
# Each architecture builds on its own kind of runner. ARM used to be emulated (QEMU) on an Intel
# runner, which was slow and, from 1.3.0, crashed during `npm ci`; the per-architecture images are
# then joined into one multi-arch tag.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

  # One image for one architecture, pushed by digest only (no tags yet).
  build:
    needs: check
    strategy:
      matrix:
        image:
          - { name: openconnect, context: . }
          - { name: openconnect-studio, context: studio }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      packages: write   # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Save the digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          # "--" around the name: openconnect-* would also match openconnect-studio's digests.
          name: digests--${{ matrix.image.name }}--${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Both architectures under one set of version tags.
  publish:
    needs: build
    strategy:
      matrix:
        name: [openconnect, openconnect-studio]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digests--${{ matrix.name }}--*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Tag the multi-arch image
        working-directory: digests
        run: |
          digests=(*)
          [ "${#digests[@]}" = 2 ] || { echo "::error::Expected 2 architectures, found: ${digests[*]}"; exit 1; }
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for d in "${digests[@]}"; do args+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install or update"
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo "See the [README](https://github.com/$GITHUB_REPOSITORY#quick-start) for setup."
          } >> notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "OpenConnect $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
